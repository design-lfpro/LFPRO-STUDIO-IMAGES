      type: "agent"
      agent: "leo-orquestrador"
      file: "pipeline/steps/step-03-shotlist.md"
    - step: 4
      name: "checkpoint-shotlist"
      type: "checkpoint"
      file: "pipeline/steps/step-04-checkpoint-shotlist.md"
    - step: 5
