      type: "agent"
      agent: "gael-magnific"
      file: "pipeline/steps/step-06-generate-stills.md"
    - step: 7
      name: "checkpoint-stills"
      type: "checkpoint"
      file: "pipeline/steps/step-07-checkpoint-stills.md"
    - step: 8
      name: "motion"
      type: "agent"
      agent: "miguel-motion"
      file: "pipeline/steps/step-08-motion.md"
    - step: 9
      name: "generate-clips"
      type: "agent"
      agent: "gael-magnific"
      file: "pipeline/steps/step-09-generate-clips.md"
    - step: 10
      name: "checkpoint-clips"
